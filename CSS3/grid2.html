<!DOCTYPE html>
<html>
<head>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 equal columns */
      gap: 10px;
      background-color: #f1f1f1;
      padding: 10px;
    }

    .grid-container > div {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      font-size: 18px;
      text-align: center;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>Grid: 4 Columns, 2 Rows</h2>

  <div class="grid-container">
    <div>Box 1</div>
    <div>Box 2</div>
    <div>Box 3</div>
    <div>Box 4</div>
    <div>Box 5</div>
    <div>Box 6</div>
    <div>Box 7</div>
    <div>Box 8</div>
  </div>

</body>
</html>
