<!DOCTYPE html>
<html>
<head>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 equal columns */
      gap: 10px;
      background-color: #f1f1f1;
      padding: 10px;
    }

    .grid-container > div {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      font-size: 18px;
      text-align: center;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>Basic Grid Example (3 Columns)</h2>

  <div class="grid-container">
    <div>Item 1</div>
    <div>Item 2</div>
    <div>Item 3</div>
    <div>Item 4</div>
    <div>Item 5</div>
    <div>Item 6</div>
  </div>

</body>
</html>
