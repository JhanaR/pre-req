<!DOCTYPE HTML>
<html>

<head>
    <title>A title</title>
    <style>
        body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    fieldset {
      border: none;
      padding: 0;
    }

    button {
      padding: 10px;
      background-color: #08a55c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #b30065;
    }
    </style>
</head>

<body>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="" required />
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="" required />
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="" required />
        <br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="" required />
        <br>
        <fieldset>
            <legend>Gender:</legend>
            <input name="gender" id="male" type="radio" value="male" /><label for="male">Male</label>
            <input name="gender" id="female" type="radio" value="female" /><label for="female">Female</label>
        </fieldset>
        <br>
        <fieldset>
            <legend>Skills:</legend>
            <input type="checkbox" id="html5" name="skills" value="html5" /> <label for="html5">HTML</label>
            <input type="checkbox" id="css3" name="skills" value="css3" /> <label for="css3">CSS</label>
            <input type="checkbox" id="js" name="skills" value="javascript" /> <label for="js">JavaScript</label>
        </fieldset>
        <br>
        <button>SUBMIT </button>
    </form>
</body>

</html>
