<!DOCTYPE html>
<html>
  <head>
    <title>A title</title>
  </head>
  <body>
    <h1>welcome jhana</h1>
    <input type="text" id="text" />
    <p id ="pid"></p>
    <button id="bid">Clear</button>
    <script>
        const input = document.getElementById("text");
        const parah = document.getElementById("pid");
        const but = document.getElementById("bid");

        input.addEventListener("keyup",() => {
            parah.innerHTML = input.value;
        })

        but.addEventListener("click", () => {
            input.value = "";
            parah.innerHTML = "";
        })
    </script>
  </body>
</html>
